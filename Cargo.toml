[workspace]
resolver = "2"
members = ["crates/engine", "crates/app", "third_party/riti"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# NOTE: do not set panic = "abort": the engine relies on catch_unwind so that a
# bug inside the Bangla engine can never crash the keyboard hook.
