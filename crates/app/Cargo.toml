[package]
name = "jype"
version = "0.3.0"
edition = "2021"
description = "Jype - fast, friendly Bangla typing for Windows 10/11"

[features]
default = ["extra-layouts"]
extra-layouts = ["bangla-engine/extra-layouts"]

[build-dependencies]
winresource = "0.1"

[dependencies]
bangla-engine = { path = "../engine", default-features = false }

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
